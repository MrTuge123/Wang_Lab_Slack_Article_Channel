name: Paper digest

on:
  schedule:
    - cron: "0 7 * * 1"
      timezone: "America/New_York"  # Mondays 7am Ann Arbor time (GitHub handles daylight saving)
  workflow_dispatch:        # adds a "Run workflow" button on GitHub
    inputs:
      subscriber:
        description: "Only this subscriber (file name in subscribers/, without .yaml). Empty = all."
        required: false
        default: ""

permissions:
  contents: write           # lets the job commit seen/ back

concurrency:
  group: paper-digest       # never run two digests at once
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 45     # Kimi allows ~3 calls/min; each subscriber needs a few (relevance, summaries, Chinese)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run digest
        env:
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}   # optional
          # Email sender account
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}                  # optional
          # Webhook URLs / recipient lists named by webhook_env / to_env in subscribers/*.yaml.
          # A new subscriber with a new secret name needs a line here too. (Passing all secrets
          # at once gets the workflow flagged by GitHub as possibly malicious.)
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          WeCom_URL: ${{ secrets.WECOM_URL }}
          SLACK_WEBHOOK_EXAMPLE_LAB: ${{ secrets.SLACK_WEBHOOK_EXAMPLE_LAB }}
          WECOM_URL_EXAMPLE_LAB: ${{ secrets.WECOM_URL_EXAMPLE_LAB }}
          EMAIL_TO_WANG_LAB: ${{ secrets.EMAIL_TO_WANG_LAB }}
          EMAIL_TO_XINRUI_DONG: ${{ secrets.EMAIL_TO_XINRUI_DONG }}
          EMAIL_TO_FAN_SHIJIE: ${{ secrets.EMAIL_TO_FAN_SHIJIE }}
          EMAIL_TO_HUANG_SHENGYUAN: ${{ secrets.EMAIL_TO_HUANG_SHENGYUAN }}
          SUBSCRIBER: ${{ inputs.subscriber }}
        run: python main.py ${SUBSCRIBER:+--subscriber "$SUBSCRIBER"}

      - name: Save seen/ and history/
        if: ${{ !cancelled() }}   # also when one chat failed, so the other doesn't get repeats
        run: |
          [ -d seen ] || [ -d history ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -rf "$RUNNER_TEMP/ours" && mkdir "$RUNNER_TEMP/ours"
          for d in seen history; do [ -d "$d" ] && cp -r "$d" "$RUNNER_TEMP/ours/"; done
          # If seen/ or history/ was pushed from elsewhere during the run (e.g. a laptop), merge
          # both versions onto the latest commit instead of failing or overwriting; retry if it races again.
          for attempt in 1 2 3; do
            git fetch --quiet origin "$GITHUB_REF_NAME"
            git reset --quiet --hard "origin/$GITHUB_REF_NAME"
            for f in "$RUNNER_TEMP"/ours/seen/*.json; do
              [ -e "$f" ] && python -m digest.store merge "$f" "seen/$(basename "$f")"
            done
            for f in "$RUNNER_TEMP"/ours/history/*.jsonl; do
              [ -e "$f" ] && python -m digest.history merge "$f" "history/$(basename "$f")"
            done
            for d in seen history; do [ -d "$d" ] && git add "$d"; done
            git diff --cached --quiet && exit 0
            git commit --quiet -m "Update seen/ and history/ [skip ci]"
            git push --quiet && exit 0
            echo "Push rejected (attempt $attempt), merging again..."
            sleep $((attempt * 5))
          done
          exit 1
