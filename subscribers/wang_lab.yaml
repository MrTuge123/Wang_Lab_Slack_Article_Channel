# Wang Lab. Any setting from config.yaml can be overridden here.
name: "Wang Lab"

# What to search for: EITHER a boolean query, translated into every source's syntax...
#   words or "quoted phrases", AND / OR / NOT (upper case), parentheses. PubMed gets it as written.
#   Preview each source's version:  python -m digest.query '<your query>'
query: >-
  ("graph neural network"[tiab] OR "graph neural networks"[tiab] OR GNN[tiab] OR GNNs[tiab]
  OR "graph convolutional network"[tiab] OR "graph convolutional networks"[tiab]
  OR "graph attention network"[tiab] OR "graph attention networks"[tiab] OR "graph transformer"[tiab]
  OR "graph autoencoder"[tiab] OR "graph representation learning"[tiab])
  AND ("multi-omics"[tiab] OR "multi-omic"[tiab] OR multiomics[tiab] OR multiomic[tiab] OR omics[tiab]
  OR transcriptomics[tiab] OR transcriptomic[tiab] OR proteomics[tiab] OR metabolomics[tiab]
  OR genomics[tiab] OR epigenomics[tiab] OR "single-cell"[tiab] OR "single cell"[tiab] OR scRNA-seq[tiab]
  OR "spatial transcriptomics"[tiab] OR "gene expression"[tiab] OR "gene regulatory"[tiab]
  OR "protein-protein interaction"[tiab] OR "cancer subtype"[tiab] OR "cancer subtypes"[tiab])
  NOT (molecule[ti] OR molecules[ti] OR "molecular property"[ti] OR "molecular properties"[ti]
  OR "molecular generation"[ti] OR retrosynthesis[ti] OR catalyst[ti] OR catalysts[ti] OR catalysis[ti]
  OR crystal[ti] OR crystals[ti] OR polymer[ti] OR polymers[ti] OR "potential energy"[ti] OR "force field"[ti]
  OR "quantum chemistry"[ti] OR tautomer[ti] OR tautomers[ti] OR "retention time"[ti] OR toxicology[ti]
  OR "natural products"[ti] OR "traditional Chinese medicine"[ti] OR traffic[ti] OR "power grid"[ti]
  OR "social network"[ti] OR "social networks"[ti] OR recommender[ti] OR "fault diagnosis"[ti]
  OR "intrusion detection"[ti] OR "point cloud"[ti] OR "remote sensing"[ti] OR EEG[ti] OR fMRI[ti]
  OR radiomics[ti] OR food[ti])

# What the readers care about, in plain English: Kimi judges each paper's relevance against this
# and tailors the summaries to it (without it, Kimi gets the whole query above).
interest: >-
  Graph neural networks for multi-omics, single-cell and spatial omics data in bioinformatics
  (not chemistry or molecular property prediction)

# ...OR a plain-English topic (delete query: above); Kimi writes the boolean query on each run:
# topic: "graph neural networks applied to biomedical knowledge graphs"

# Where to search besides PubMed. To hand-tune one source, give it its own query:
# in that source's syntax, e.g.  arxiv: {enabled: true, query: 'ti:"knowledge graph"'}
sources:
  europepmc:
    enabled: true
    query: >-
      TITLE_ABS:("graph neural network" OR "graph neural networks" OR GNN OR GNNs
      OR "graph convolutional network" OR "graph convolutional networks" OR "graph attention network"
      OR "graph attention networks" OR "graph transformer" OR "graph autoencoder" OR "graph representation learning")
      AND TITLE_ABS:("multi-omics" OR "multi-omic" OR multiomics OR multiomic OR omics OR transcriptomics
      OR transcriptomic OR proteomics OR metabolomics OR genomics OR epigenomics OR "single-cell" OR "single cell"
      OR scRNA-seq OR "spatial transcriptomics" OR "gene expression" OR "gene regulatory"
      OR "protein-protein interaction" OR "cancer subtype" OR "cancer subtypes")
      NOT TITLE:(molecule OR molecules OR "molecular property" OR "molecular properties" OR "molecular generation"
      OR retrosynthesis OR catalyst OR catalysts OR catalysis OR crystal OR crystals OR polymer OR polymers
      OR "potential energy" OR "force field" OR "quantum chemistry" OR tautomer OR tautomers OR "retention time"
      OR toxicology OR "natural products" OR "traditional Chinese medicine" OR traffic OR "power grid"
      OR "social network" OR "social networks" OR recommender OR "fault diagnosis" OR "intrusion detection"
      OR "point cloud" OR "remote sensing" OR EEG OR fMRI OR radiomics OR food)
  openalex:         {enabled: false}
  semantic_scholar: {enabled: true}
  arxiv:            {enabled: true}

# Optional: hard filter, only these journals (leave the list empty [] for all journals).
# Preprints are dropped when this is set.
journals: []
#  - "Nature"
#  - "Environmental Science & Technology"

ranking:
  # Always score full marks for these. Authors: OpenAlex ID (safer, e.g. "A5023888391")
  # or exact name. Find IDs with:  python -m digest.openalex "Author Name"
  preferred_authors: []
  preferred_journals: []

  # + keyword_credit for each of these found in the paper's title, abstract or author keywords. Case and -/space
  # are ignored, and whole words must match: "diabetes" matches "Type 2 Diabetes" but not
  # "diabetic"; "multi-omics" doesn't match "multiomics".
  key_words: ["multi-omics", "machine learning", "knowledge graph", "graph neural network",
              "GNN", "deep learning", "AI", "artificial intelligence"]

# Where to post. webhook_env = the name of the secret holding the webhook URL
# (in .env when running locally, a repository secret on GitHub).
outputs:
  slack:
    enabled: true
    webhook_env: SLACK_WEBHOOK_URL
    chinese_summary: false
  wecom:
    enabled: false
    webhook_env: WECOM_URL_EXAMPLE_LAB
    chinese_summary: false
  email:
    enabled: true
    to_env: ['tigercui@umich.edu']
    #EMAIL_TO_WANG_LAB   # secret with the addresses, comma-separated (.env locally, GitHub secret in Actions)
    chinese_summary: false
