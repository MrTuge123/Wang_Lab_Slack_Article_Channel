# Wang Lab. Any setting from config.yaml can be overridden here.
name: "Wang Lab"

# What to search for: EITHER a boolean query, translated into every source's syntax...
#   words or "quoted phrases", AND / OR / NOT (upper case), parentheses. PubMed gets it as written.
#   Preview each source's version:  python -m digest.query '<your query>'
query: "graph neural network AND knowledge graph"
# ...OR a plain-English topic (delete query: above); Kimi writes the boolean query on each run:
# topic: "graph neural networks applied to biomedical knowledge graphs"

# Where to search besides PubMed. To hand-tune one source, give it its own query:
# in that source's syntax, e.g.  arxiv: {enabled: true, query: 'ti:"knowledge graph"'}
sources:
  europepmc:        {enabled: true}   # PubMed + bioRxiv/medRxiv preprints and more
  openalex:         {enabled: true}   # journals, conferences, preprints in every field
  semantic_scholar: {enabled: true}   # strong on CS/AI
  arxiv:            {enabled: true}   # preprints

# Optional: hard filter, only these journals (leave the list empty [] for all journals).
# Preprints are dropped when this is set.
journals: []
#  - "Nature"
#  - "Environmental Science & Technology"

ranking:
  # Always score full marks for these. Authors: OpenAlex ID (safer, e.g. "A5023888391")
  # or exact name. Find IDs with:  python -m digest.openalex "Author Name"
  preferred_authors: []
  preferred_journals: []

  # + keyword_credit for each of these found in the paper's author keywords. Case and -/space
  # are ignored, and whole words must match: "diabetes" matches "Type 2 Diabetes" but not
  # "diabetic"; "multi-omics" doesn't match "multiomics".
  key_words: ["multi-omics", "machine learning", "knowledge graph", "graph neural network",
              "GNN", "deep learning", "AI", "artificial intelligence"]

# Where to post. webhook_env = the name of the secret holding the webhook URL
# (in .env when running locally, a repository secret on GitHub).
outputs:
  slack:
    enabled: false
    webhook_env: SLACK_WEBHOOK_URL
  wecom:
    enabled: false
    webhook_env: WeCom_URL
  email:
    enabled: true            # sender account: SMTP_* secrets (see digest/notify/mail.py)
    to: ['qianhanyu722@gmail.com']                    # e.g. ["a@umich.edu", "b@umich.edu"]; or to_env: EMAIL_TO_WANG_LAB
